<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>QuickDump</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><p class="eyebrow">QUICKDUMP</p><h1>Get it out of your head.</h1></div><button id="clearAll" class="ghost">Clear all</button></header><section class="composer"><textarea id="thought" maxlength="1000" placeholder="Dump a thought, task, idea, anything..."></textarea><div class="compose-row"><select id="category"><option value="task">Task</option><option value="idea">Idea</option><option value="note">Note</option></select><button id="add" class="primary">Dump it</button></div></section><section class="toolbar"><input id="search" type="search" placeholder="Search your dumps..."><div id="filters" class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="task">Tasks</button><button class="filter" data-filter="idea">Ideas</button><button class="filter" data-filter="note">Notes</button><button class="filter" data-filter="pinned">Pinned</button></div></section><section id="stats" class="stats"></section><section id="list" class="list"></section><p id="empty" class="empty">Nothing here yet. Dump your first thought above.</p></main><script src="app.js"></script></body></html>
